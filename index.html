const RD={title:"Young people, heritage and the environment",text:"In recent years, more and more young people have become involved in protecting both the environment and their cultural heritage. Many are inspired by individuals whose life stories show courage, determination and a strong sense of responsibility. Rather than waiting for others to act, these young people take the initiative and turn their ideas into practical actions.\n\nOne example is a group of secondary school students in a mountain village. They noticed that plastic waste was polluting the stream that supplied the village with water, so they organised a clean-up and persuaded families to sort their household rubbish. Within a few months, the amount of plastic collected had fallen considerably, and the stream became clean again.\n\nHowever, changing habits is not always straightforward. Some residents were reluctant at first because reusable products seemed more expensive and less convenient. The students therefore held workshops to explain the long-term consequences of pollution, and they invited village elders to share traditional methods, such as wrapping food in banana leaves instead of plastic bags.\n\nThis cooperation shows that cultural diversity and environmental protection can support each other. By combining traditional knowledge with modern ideas, communities can find solutions that suit their local circumstances. Ultimately, young people who respect their heritage and remain committed to sustainable living can help build a greener and more inclusive world."};

{p:NT,t:"Chọn đáp án cho chỗ trống (5).",o:["interest","initiative","responsibility","advantage"],a:2,e:"take responsibility for = chịu trách nhiệm về việc gì. take interest đi với in; take the initiative đi với to/in; take advantage đi với of."},

{t:"Sắp xếp thành đoạn văn: a. As a result, people can understand different traditions better. | b. Cultural exchange plays an increasingly important role in today’s world. | c. For example, international festivals let visitors enjoy foreign food and music. | d. Therefore, learning about other cultures helps build a peaceful society.",o:["b – c – a – d","c – b – a – d","b – a – c – d","a – b – c – d"],a:0,e:"b là câu chủ đề; c nêu ví dụ (For example); a nêu kết quả (As a result); d là kết luận (Therefore)."},
{t:"Sắp xếp thành hội thoại: a. Lan: Have you read about any person whose life story inspires you? | b. Mai: Yes, a young woman who overcame many difficulties to become a doctor. | c. Lan: That’s inspiring! How did she do it? | d. Mai: She worked hard and never gave up.",o:["b – a – c – d","a – c – b – d","a – b – c – d","c – a – b – d"],a:2,e:"Hỏi (a) rồi trả lời (b); hỏi tiếp (c) rồi trả lời (d). Câu hỏi luôn đứng trước câu trả lời."},

{p:RD,t:"Which best paraphrases the sentence “Rather than waiting for others to act, these young people take the initiative and turn their ideas into practical actions”?",o:["Young people actively carry out their own ideas instead of depending on others.","Young people prefer adults to solve problems before they act.","Young people only discuss problems and rarely do anything.","Young people wait for support before they start."],a:0,e:"Rather than waiting = thay vì chờ đợi; take the initiative = chủ động; turn ideas into actions = biến ý tưởng thành hành động."},
{p:RD,t:"In which paragraph does the writer discuss the difficulties of changing habits?",o:["Paragraph 1","Paragraph 2","Paragraph 3","Paragraph 4"],a:2,e:"Đoạn 3 mở đầu bằng “changing habits is not always straightforward” và nêu sự ngại thay đổi của người dân."},
{p:RD,t:"According to paragraph 2, what did the students do?",o:["They built a water factory.","They organised a clean-up and persuaded families to sort rubbish.","They asked the government to ban plastic.","They moved to the city."],a:1,e:"Đoạn 2: “they organised a clean-up and persuaded families to sort their household rubbish”."},
{p:RD,t:"The word “reluctant” is closest in meaning to ______.",o:["eager","unwilling","confident","responsible"],a:1,e:"reluctant = miễn cưỡng, không sẵn lòng, đồng nghĩa với unwilling. eager là trái nghĩa."},
{p:RD,t:"The word “they” in “and they invited village elders” refers to ______.",o:["the residents","the village elders","the students","the families"],a:2,e:"Chủ ngữ của cả câu là “The students”, nên they = the students."},
{p:RD,t:"The word “considerably” is OPPOSITE in meaning to ______.",o:["greatly","slightly","quickly","suddenly"],a:1,e:"considerably = đáng kể, nhiều; trái nghĩa là slightly = một chút, không đáng kể."},

{p:RD,t:"What can be inferred from the passage?",o:["Traditional methods can help reduce plastic use.","Banana leaves are more expensive than plastic bags.","The students ignored the elders’ advice.","The stream will never be clean again."],a:0,e:"Người già dạy cách gói thức ăn bằng lá chuối thay túi nhựa, nên phương pháp truyền thống có thể giúp giảm rác nhựa."}];

const UQ=[
{t:"Combine: “He left school with no academic qualifications. He found a well-paid job.” (although)",o:["Although he left school with no academic qualifications, he found a well-paid job.","Although he left school with no academic qualifications, but he found a well-paid job.","Because he left school with no academic qualifications, he found a well-paid job.","He left school with no academic qualifications, so he found a well-paid job."],a:0,e:"Although = mặc dù, chỉ sự tương phản và không dùng cùng but. Because và so diễn tả nguyên nhân – kết quả nên sai nghĩa."},
{t:"Combine: “People learn English well. They will have a better chance of getting a job.” (if)",o:["If people learn English well, they will have a better chance of getting a job.","If people will learn English well, they will have a better chance of getting a job.","Unless people learn English well, they will have a better chance of getting a job.","People learn English well if, they will have a better chance of getting a job."],a:0,e:"Câu điều kiện loại 1: If + hiện tại đơn, will + V. Không dùng will trong mệnh đề if; unless làm sai nghĩa."},
{t:"Combine: “This job requires good language skills. It also requires communication skills.” (not only … but also)",o:["This job requires not only good language skills but also communication skills.","This job requires not only good language skills and also communication skills.","This job not only requires but also good language skills and communication skills.","Not only this job requires good language skills but also communication skills."],a:0,e:"Not only … but also phải nối hai thành phần song song: not only good language skills but also communication skills. Đảo ngữ cần trợ động từ (Not only does this job…)."},
{t:"Which sentence is a COMPOUND sentence?",o:["My brother didn’t apply for the job, but he was offered an apprenticeship.","When I was younger, I wanted to become a driver.","Because my brother is often late, he is never promoted.","My brother didn’t apply for the job."],a:0,e:"Câu ghép gồm hai mệnh đề độc lập nối bằng liên từ (but). B và C là câu phức (when, because); D là câu đơn."},
{t:"Which sentence is a COMPLEX sentence?",o:["She is tired, so she is going home.","Although the work is hard, it is rewarding.","He works hard, and he earns a lot.","Nursing is tiring; moreover, the pay is low."],a:1,e:"Câu phức có một mệnh đề phụ bắt đầu bằng liên từ phụ thuộc (although). Các câu còn lại là câu ghép."},
{t:"Being a nurse is tiring; ______, you don’t earn a high salary.",o:["moreover","because","although","if"],a:0,e:"Sau dấu chấm phẩy dùng trạng từ liên kết như moreover (hơn nữa). Because, although, if là liên từ phụ thuộc, không đứng sau dấu chấm phẩy theo cách này."},
{t:"He wanted the job, ______ he had no relevant qualifications.",o:["but","so","because","or"],a:0,e:"Hai ý đối lập (muốn việc nhưng thiếu bằng cấp) nên dùng but."},
{t:"______ the company offers a generous bonus, few people want to work there.",o:["Although","Because","So that","Unless"],a:0,e:"Hai vế đối lập: lương thưởng cao nhưng ít người muốn làm, nên dùng although."},
{p:AD,t:"What is NOT required from applicants?",o:["Experience","Enthusiasm","Responsibility","Applying in person"],a:0,e:"Quảng cáo ghi “No experience is required”. Các mục còn lại đều được nhắc đến."},
{p:AD,t:"Which benefit does the café offer?",o:["Free meals","A company car","Paid holidays abroad","A yearly bonus"],a:0,e:"Quảng cáo nêu “an hourly wage, free meals and flexible working hours”."},
{p:AD,t:"“On-the-job training” means training that ______.",o:["is given while employees are working","is held at a university","is only for managers","costs the employee money"],a:0,e:"on-the-job training = đào tạo ngay trong lúc làm việc, tại nơi làm việc."}];
